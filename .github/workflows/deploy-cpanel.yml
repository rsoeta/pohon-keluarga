name: Deploy PWA ke Shared Hosting / cPanel via SSH

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validasi secrets wajib
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }

          VITE_API_URL="$(trim "${VITE_API_URL:-}")"
          SSH_HOST="$(trim "${SSH_HOST:-}")"
          SSH_USERNAME="$(trim "${SSH_USERNAME:-}")"
          CPANEL_TARGET_DIR="$(trim "${CPANEL_TARGET_DIR:-}")"

          for var in VITE_API_URL SSH_HOST SSH_USERNAME SSH_PRIVATE_KEY CPANEL_TARGET_DIR; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret $var wajib diisi di GitHub Repository Secrets."
              exit 1
            fi
          done
          if [[ ! "$VITE_API_URL" =~ ^https:// ]]; then
            echo "::error::VITE_API_URL wajib diawali https://."
            exit 1
          fi

          RE='^(~/|/)?[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*/?$'
          if [ "$CPANEL_TARGET_DIR" = "/" ] || [ "$CPANEL_TARGET_DIR" = "." ] || [[ "$CPANEL_TARGET_DIR" == *".."* ]] || [[ ! "$CPANEL_TARGET_DIR" =~ $RE ]]; then
            echo "::error::CPANEL_TARGET_DIR tidak valid. Contoh valid: /home/username/public_html, ~/public_html, atau public_html/sub."
            exit 1
          fi

      - name: Instal dependensi & Build produksi PWA
        working-directory: frontend
        env:
          RAW_VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_DOMAIN: www.altasim.studio-pasti.net
          VITE_DEBUG: 'false'
        run: |
          set -euo pipefail
          VITE_API_URL="${RAW_VITE_API_URL//$'\r'/}"
          VITE_API_URL="${VITE_API_URL//$'\n'/}"
          VITE_API_URL="${VITE_API_URL#"${VITE_API_URL%%[![:space:]]*}"}"
          VITE_API_URL="${VITE_API_URL%"${VITE_API_URL##*[![:space:]]}"}"
          export VITE_API_URL
          npm ci
          npm run build

      - name: Siapkan koneksi SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          SSH_HOST="$(trim "${SSH_HOST:-}")"
          PORT="$(trim "${SSH_PORT:-22}")"
          [ -z "$PORT" ] && PORT="22"

          if [ "$PORT" = "22" ]; then
            HOST_LOOKUP="$SSH_HOST"
          else
            HOST_LOOKUP="[$SSH_HOST]:$PORT"
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY//$'\r'/}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::Secret SSH_PRIVATE_KEY tidak valid atau masih dilindungi passphrase. Pastikan yang ditempel adalah isi file private key (bukan .pub) tanpa passphrase."
            exit 1
          fi

          : > ~/.ssh/known_hosts
          HAS_USER_KNOWN_HOSTS=0
          if [ -n "$(trim "${SSH_KNOWN_HOSTS:-}")" ]; then
            HAS_USER_KNOWN_HOSTS=1
            printf '%s\n' "${SSH_KNOWN_HOSTS//$'\r'/}" | awk 'NF' > ~/.ssh/known_hosts
            if [ "$PORT" != "22" ] && ! ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
              if awk -v h="$SSH_HOST" '$1 == h { found=1 } END { exit(found ? 0 : 1) }' ~/.ssh/known_hosts; then
                awk -v h="$SSH_HOST" -v hl="$HOST_LOOKUP" '{ if ($1 == h) $1 = hl; print }' ~/.ssh/known_hosts > ~/.ssh/known_hosts.tmp
                mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
              fi
            fi
          fi

          if ! ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            if [ "$HAS_USER_KNOWN_HOSTS" -eq 1 ]; then
              echo "::warning::Entri SSH_KNOWN_HOSTS tidak cocok untuk host/port target; mencoba pemindaian otomatis via ssh-keyscan."
            fi
            ssh-keyscan -T 5 -p "$PORT" -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if ! ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
              ssh-keyscan -T 5 -p "$PORT" -t ecdsa,rsa "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
          fi

          chmod 644 ~/.ssh/known_hosts
          if ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            STRICT_MODE="yes"
            KEY_COUNT="$(ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts | grep -cv '^#' || true)"
            echo "Host key SSH terverifikasi ($KEY_COUNT kunci dimuat, mode ketat)."
          else
            : > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            STRICT_MODE="accept-new"
            echo "::warning::ssh-keyscan tidak memperoleh host key (umum terjadi pada server OpenSSH 9.9). Beralih ke StrictHostKeyChecking=accept-new untuk sesi deploy ini; isi secret SSH_KNOWN_HOSTS via perintah ssh di DEPLOYMENT.md untuk pinning permanen."
          fi

          echo "SSH_STRICT_MODE=$STRICT_MODE" >> "$GITHUB_ENV"

      - name: Deploy frontend/dist ke cPanel via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          SSH_HOST="$(trim "${SSH_HOST:-}")"
          SSH_USERNAME="$(trim "${SSH_USERNAME:-}")"
          CPANEL_TARGET_DIR="$(trim "${CPANEL_TARGET_DIR:-}")"
          CPANEL_TARGET_DIR="${CPANEL_TARGET_DIR%/}"
          PORT="$(trim "${SSH_PORT:-22}")"
          [ -z "$PORT" ] && PORT="22"

          STRICT_MODE="${SSH_STRICT_MODE:-yes}"
          if [ "$STRICT_MODE" != "yes" ] && [ "$STRICT_MODE" != "accept-new" ]; then
            STRICT_MODE="yes"
          fi

          SSH_COMMON="-i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          SSH_INIT_CMD="ssh $SSH_COMMON -o StrictHostKeyChecking=$STRICT_MODE"
          SSH_STRICT_CMD="ssh $SSH_COMMON -o StrictHostKeyChecking=yes"

          $SSH_INIT_CMD "${SSH_USERNAME}@${SSH_HOST}" "TARGET='$CPANEL_TARGET_DIR'; case \"\$TARGET\" in '~/'*) TARGET=\"\$HOME/\${TARGET#~/}\" ;; /*) ;; *) TARGET=\"\$HOME/\$TARGET\" ;; esac; mkdir -p \"\$TARGET\""

          if $SSH_STRICT_CMD "${SSH_USERNAME}@${SSH_HOST}" "command -v rsync >/dev/null 2>&1"; then
            rsync -avz --delete \
              --exclude='.well-known/' \
              --exclude='cgi-bin/' \
              --exclude='error_log' \
              -e "$SSH_STRICT_CMD" \
              frontend/dist/ "${SSH_USERNAME}@${SSH_HOST}:${CPANEL_TARGET_DIR}/"
          else
            tar -C frontend/dist -czf - . | $SSH_STRICT_CMD "${SSH_USERNAME}@${SSH_HOST}" \
              "TARGET='$CPANEL_TARGET_DIR'; case \"\$TARGET\" in '~/'*) TARGET=\"\$HOME/\${TARGET#~/}\" ;; /*) ;; *) TARGET=\"\$HOME/\$TARGET\" ;; esac; find \"\$TARGET\" -mindepth 1 -maxdepth 1 ! -name '.well-known' ! -name 'cgi-bin' ! -name 'error_log' -exec rm -rf {} + && tar -xzf - -C \"\$TARGET\""
          fi

      - name: Bersihkan kunci SSH sementara
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
